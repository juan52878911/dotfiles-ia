name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build the pyz
        run: python3 -c "from delega.util import build_pyz; build_pyz('dist/delega.pyz')"
        env:
          PYTHONPATH: src
      - name: Run the pyz
        run: python3 dist/delega.pyz version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ruff
        run: pip install ruff && ruff check .
      - name: shellcheck
        run: shellcheck nodes/*.sh nodes/windows-wsl/*.sh
