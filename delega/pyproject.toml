[project]
name = "delega"
version = "0.1.0"
description = "Run Claude Code workers on other accounts and machines, with hard caps, budgets and a two-way channel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
delega = "delega.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
delega = ["i18n/*.json"]

[tool.ruff]
line-length = 120
